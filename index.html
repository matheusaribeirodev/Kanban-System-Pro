<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban System Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-box">
          <span></span><span></span><span></span>
        </div>
        <h1>Kanban Workspace</h1>
      </div>
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Pesquisar tarefas por título ou tag...">
      </div>
    </div>
    
    <div class="header-right">
      <div class="filter-group">
        <select id="filter-priority" class="select-filter">
          <option value="all">Todas as Prioridades</option>
          <option value="high">Alta Prioridade</option>
          <option value="medium">Média Prioridade</option>
          <option value="low">Baixa Prioridade</option>
        </select>
      </div>
      <button id="open-modal-btn" class="btn primary-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>Nova Tarefa</span>
      </button>
    </div>
  </header>

  <!-- Quadro Kanban -->
  <main class="kanban-board">
    <!-- Coluna: A Fazer -->
    <section class="column" data-status="todo">
      <div class="column-header">
        <div class="column-title-group">
          <span class="status-dot todo-dot"></span>
          <h2>A Fazer</h2>
        </div>
        <span class="task-counter" id="count-todo">0</span>
      </div>
      <div class="task-list" id="todo"></div>
      <button class="add-quick-btn" data-status="todo">+ Adicionar Cartão</button>
    </section>

    <!-- Coluna: Em Progresso -->
    <section class="column" data-status="in-progress">
      <div class="column-header">
        <div class="column-title-group">
          <span class="status-dot progress-dot"></span>
          <h2>Em Progresso</h2>
        </div>
        <span class="task-counter" id="count-in-progress">0</span>
      </div>
      <div class="task-list" id="in-progress"></div>
      <button class="add-quick-btn" data-status="in-progress">+ Adicionar Cartão</button>
    </section>

    <!-- Coluna: Concluído -->
    <section class="column" data-status="done">
      <div class="column-header">
        <div class="column-title-group">
          <span class="status-dot done-dot"></span>
          <h2>Concluído</h2>
        </div>
        <span class="task-counter" id="count-done">0</span>
      </div>
      <div class="task-list" id="done"></div>
      <button class="add-quick-btn" data-status="done">+ Adicionar Cartão</button>
    </section>
  </main>

  <!-- Modal do Formulário -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Criar Nova Tarefa</h3>
        <button class="btn-close" id="close-modal-btn">&times;</button>
      </div>
      
      <form id="task-form">
        <input type="hidden" id="task-id">
        <input type="hidden" id="task-target-status" value="todo">

        <div class="form-field">
          <label for="task-title">Título *</label>
          <input type="text" id="task-title" required placeholder="O que precisa de ser feito?" maxlength="80">
        </div>

        <div class="form-field">
          <label for="task-desc">Descrição</label>
          <textarea id="task-desc" rows="3" placeholder="Adicione detalhes, links ou sub-tarefas..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="task-priority">Prioridade</label>
            <select id="task-priority">
              <option value="low">Baixa</option>
              <option value="medium" selected>Média</option>
              <option value="high">Alta</option>
            </select>
          </div>

          <div class="form-field">
            <label for="task-tag">Categoria / Tag</label>
            <input type="text" id="task-tag" placeholder="Ex: Design, Bug, Dev" maxlength="20">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn secondary-btn" id="cancel-modal-btn">Cancelar</button>
          <button type="submit" class="btn primary-btn" id="submit-modal-btn">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
